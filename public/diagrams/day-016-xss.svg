<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="xss-title xss-desc">
  <title id="xss-title">XSS 與輸出編碼</title>
  <desc id="xss-desc">不可信資料進入頁面；未編碼時成為可執行內容，編碼後只是文字。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="60" y="70" width="200" height="100" rx="16" fill="#10243b"/>
  <text x="160" y="112" text-anchor="middle" fill="#93e5db" font-size="15" font-weight="700">不可信資料</text>
  <text x="160" y="138" text-anchor="middle" fill="#ffffff" font-size="12">使用者輸入</text>
  <path d="M260 120h110" stroke="#d4872f" stroke-width="3"/>
  <rect x="370" y="58" width="200" height="124" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="470" y="98" text-anchor="middle" fill="#9a5e27" font-size="14" font-weight="700">錯誤：直接輸出</text>
  <text x="470" y="126" text-anchor="middle" fill="#60717d" font-size="12">&lt;script&gt; 被執行</text>
  <text x="470" y="150" text-anchor="middle" fill="#60717d" font-size="12">變成程式碼</text>
  <path d="M260 240h110" stroke="#0b938b" stroke-width="3"/>
  <rect x="370" y="202" width="200" height="124" rx="16" fill="#d9f0ec" stroke="#0b938b"/>
  <text x="470" y="242" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">正確：情境編碼</text>
  <text x="470" y="270" text-anchor="middle" fill="#60717d" font-size="12">顯示為純文字</text>
  <text x="470" y="294" text-anchor="middle" fill="#60717d" font-size="12">或使用安全 DOM API</text>
  <text x="460" y="370" text-anchor="middle" fill="#16283a" font-size="14">輸出位置決定編碼規則</text>
</svg>
