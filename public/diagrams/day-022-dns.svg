<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="dns-title dns-desc">
  <title id="dns-title">DNS 與 DNSSEC</title>
  <desc id="dns-desc">使用者查詢網域，解析器取得簽名資料後驗證，再換成 IP 連線。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="50" y="80" width="220" height="90" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="160" y="120" text-anchor="middle" fill="#16283a" font-size="15" font-weight="700">使用者</text>
  <text x="160" y="146" text-anchor="middle" fill="#60717d" font-size="12">想知道 example.com</text>
  <rect x="360" y="80" width="220" height="90" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="470" y="120" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">解析器</text>
  <text x="470" y="146" text-anchor="middle" fill="#60717d" font-size="12">查詢 + 驗證簽章</text>
  <rect x="670" y="80" width="200" height="90" rx="16" fill="#10243b"/>
  <text x="770" y="120" text-anchor="middle" fill="#93e5db" font-size="14" font-weight="700">DNS 伺服器</text>
  <text x="770" y="146" text-anchor="middle" fill="#ffffff" font-size="12">簽名資料</text>
  <path d="M270 125h90" stroke="#0b938b" stroke-width="3"/>
  <path d="M580 125h90" stroke="#0b938b" stroke-width="3"/>
  <rect x="240" y="260" width="440" height="90" rx="16" fill="#d9f0ec" stroke="#0b938b"/>
  <text x="460" y="298" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">DNSSEC 驗證資料來源；DoH／DoT 加密查詢</text>
  <text x="460" y="324" text-anchor="middle" fill="#60717d" font-size="12">簽章防竄改，加密保隱私：兩件事不同</text>
</svg>
