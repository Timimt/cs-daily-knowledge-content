<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="se-title se-desc">
  <title id="se-title">社交工程</title>
  <desc id="se-desc">攻擊者偽裝身分、製造緊迫感，誘使目標交出資訊；防禦方式是改用已知管道確認。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="60" y="60" width="280" height="110" rx="18" fill="#10243b"/>
  <text x="200" y="100" text-anchor="middle" fill="#93e5db" font-size="15" font-weight="700">攻擊者</text>
  <text x="200" y="128" text-anchor="middle" fill="#ffffff" font-size="12">假冒主管／客服／警方</text>
  <text x="200" y="152" text-anchor="middle" fill="#ffffff" font-size="12">「很急，現在就做！」</text>
  <rect x="580" y="60" width="280" height="110" rx="18" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="720" y="100" text-anchor="middle" fill="#16283a" font-size="15" font-weight="700">目標</text>
  <text x="720" y="128" text-anchor="middle" fill="#60717d" font-size="12">感到緊張、想幫忙</text>
  <path d="M340 115h240" stroke="#d4872f" stroke-width="3"/>
  <text x="460" y="100" text-anchor="middle" fill="#9a5e27" font-size="12">信任與情緒</text>
  <rect x="180" y="260" width="560" height="84" rx="16" fill="#d9f0ec" stroke="#0b938b"/>
  <text x="460" y="296" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">防禦：換一個已知管道重新確認</text>
  <text x="460" y="322" text-anchor="middle" fill="#60717d" font-size="12">不要用攻擊者給的電話、連結或聯絡人去驗證</text>
</svg>
