<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="backup-title backup-desc">
  <title id="backup-title">3-2-1 備份</title>
  <desc id="backup-desc">原始資料、本機不同媒體備份、異地備份，分散風險。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="60" y="80" width="230" height="120" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="175" y="126" text-anchor="middle" fill="#16283a" font-size="15" font-weight="700">原始資料</text>
  <text x="175" y="152" text-anchor="middle" fill="#60717d" font-size="12">工作電腦</text>
  <rect x="345" y="80" width="230" height="120" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="460" y="126" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">第二份：本機外接</text>
  <text x="460" y="152" text-anchor="middle" fill="#60717d" font-size="12">不同媒體</text>
  <rect x="630" y="80" width="230" height="120" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="745" y="126" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">第三份：異地</text>
  <text x="745" y="152" text-anchor="middle" fill="#60717d" font-size="12">雲端或其他地點</text>
  <text x="460" y="260" text-anchor="middle" fill="#0a7d74" font-size="16" font-weight="700">3 份資料 · 2 種媒體 · 1 份異地</text>
  <rect x="180" y="300" width="560" height="70" rx="14" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="460" y="340" text-anchor="middle" fill="#60717d" font-size="14">完成標準：定期實際執行還原測試</text>
</svg>
