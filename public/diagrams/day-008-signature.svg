<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="sig-title sig-desc">
  <title id="sig-title">數位簽章流程</title>
  <desc id="sig-desc">文件先計算雜湊，再用私鑰產生簽章；接收端用公鑰驗證簽章是否與文件相符。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="70" y="90" width="200" height="120" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="170" y="138" text-anchor="middle" fill="#16283a" font-size="16" font-weight="700">文件</text>
  <text x="170" y="166" text-anchor="middle" fill="#60717d" font-size="12">任意長度</text>
  <rect x="350" y="90" width="190" height="120" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="445" y="138" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">雜湊摘要</text>
  <text x="445" y="166" text-anchor="middle" fill="#60717d" font-size="12">固定長度</text>
  <rect x="620" y="90" width="210" height="120" rx="16" fill="#10243b"/>
  <text x="725" y="132" text-anchor="middle" fill="#93e5db" font-size="15" font-weight="700">私鑰簽名</text>
  <text x="725" y="160" text-anchor="middle" fill="#ffffff" font-size="12">產生簽章</text>
  <path d="M270 150h80" stroke="#0b938b" stroke-width="3"/>
  <path d="M540 150h80" stroke="#0b938b" stroke-width="3"/>
  <rect x="70" y="276" width="760" height="74" rx="14" fill="#fff1e7" stroke="#d4872f"/>
  <text x="450" y="306" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">接收端：公鑰驗證簽章 + 文件</text>
  <text x="450" y="330" text-anchor="middle" fill="#60717d" font-size="13">公鑰公開；私鑰只留在簽名者手中</text>
</svg>
