<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="ir-title ir-desc">
  <title id="ir-title">事件處理與 STRIDE</title>
  <desc id="ir-desc">事件處理五階段對應事後流程，STRIDE 六類威脅用於事前建模。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <text x="460" y="40" text-anchor="middle" fill="#17283a" font-size="18" font-weight="700">事後流程 vs 事前思考</text>
  <rect x="60" y="70" width="360" height="200" rx="18" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="240" y="100" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">事件處理</text>
  <text x="240" y="132" text-anchor="middle" fill="#60717d" font-size="12">準備 → 偵測分析</text>
  <text x="240" y="158" text-anchor="middle" fill="#60717d" font-size="12">→ 遏制 → 根除恢復</text>
  <text x="240" y="184" text-anchor="middle" fill="#60717d" font-size="12">→ 事後檢討</text>
  <text x="240" y="220" text-anchor="middle" fill="#16283a" font-size="12">保留證據與時間線</text>
  <rect x="500" y="70" width="360" height="200" rx="18" fill="#fff1e7" stroke="#d4872f"/>
  <text x="680" y="100" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">STRIDE 威脅建模</text>
  <text x="680" y="132" text-anchor="middle" fill="#60717d" font-size="12">偽冒、竄改、否認</text>
  <text x="680" y="158" text-anchor="middle" fill="#60717d" font-size="12">洩漏、阻斷、提權</text>
  <text x="680" y="220" text-anchor="middle" fill="#16283a" font-size="12">開發前逐項提問</text>
  <text x="460" y="330" text-anchor="middle" fill="#60717d" font-size="14">一個管「發生後」，一個管「發生前」</text>
</svg>
