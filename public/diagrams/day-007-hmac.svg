<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="mac-title mac-desc">
  <title id="mac-title">HMAC 訊息驗證碼</title>
  <desc id="mac-desc">傳送端用訊息與共享密鑰產生標籤；接收端用相同密鑰重算，比對後決定是否接受。</desc>
  <rect width="920" height="430" fill="#f5f3ee"/>
  <text x="460" y="40" text-anchor="middle" fill="#17283a" font-size="20" font-weight="700">訊息 + 密鑰 → 標籤 → 驗證</text>
  <rect x="70" y="78" width="220" height="96" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="180" y="118" text-anchor="middle" fill="#16283a" font-size="15" font-weight="700">原始訊息</text>
  <text x="180" y="144" text-anchor="middle" fill="#60717d" font-size="12">message</text>
  <rect x="70" y="210" width="220" height="96" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="180" y="250" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">共享密鑰</text>
  <text x="180" y="276" text-anchor="middle" fill="#60717d" font-size="12">只有雙方知道</text>
  <rect x="390" y="130" width="200" height="110" rx="18" fill="#10243b"/>
  <text x="490" y="172" text-anchor="middle" fill="#93e5db" font-size="16" font-weight="700">HMAC</text>
  <text x="490" y="198" text-anchor="middle" fill="#ffffff" font-size="12">產生標籤 tag</text>
  <path d="M290 126h70" stroke="#0b938b" stroke-width="3"/>
  <path d="M290 258h70" stroke="#d4872f" stroke-width="3"/>
  <path d="M590 185h70" stroke="#10243b" stroke-width="3"/>
  <rect x="660" y="130" width="190" height="110" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="755" y="170" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">接收端重算</text>
  <text x="755" y="196" text-anchor="middle" fill="#60717d" font-size="12">比較收到的標籤</text>
  <text x="460" y="320" text-anchor="middle" fill="#60717d" font-size="14">沒有密鑰的人無法偽造有效標籤</text>
</svg>
