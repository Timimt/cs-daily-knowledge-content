<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="input-title input-desc">
  <title id="input-title">輸入驗證與參數陣列</title>
  <desc id="input-desc">輸入不應拼進 shell 字串；應作為獨立參數傳遞，並以白名單限制允許值。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="50" y="60" width="200" height="100" rx="16" fill="#10243b"/>
  <text x="150" y="102" text-anchor="middle" fill="#93e5db" font-size="15" font-weight="700">使用者輸入</text>
  <text x="150" y="128" text-anchor="middle" fill="#ffffff" font-size="12">檔案名、參數</text>
  <rect x="350" y="42" width="220" height="136" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="460" y="82" text-anchor="middle" fill="#9a5e27" font-size="14" font-weight="700">錯誤：拼進 shell</text>
  <text x="460" y="110" text-anchor="middle" fill="#60717d" font-size="12">run("cp " + name)</text>
  <text x="460" y="134" text-anchor="middle" fill="#60717d" font-size="12">特殊字元可能變指令</text>
  <rect x="650" y="42" width="220" height="136" rx="16" fill="#d9f0ec" stroke="#0b938b"/>
  <text x="760" y="82" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">正確：參數陣列</text>
  <text x="760" y="110" text-anchor="middle" fill="#60717d" font-size="12">run("cp", [name])</text>
  <text x="760" y="134" text-anchor="middle" fill="#60717d" font-size="12">name 只是資料</text>
  <path d="M250 110h100" stroke="#d4872f" stroke-width="3"/>
  <path d="M250 200h100" stroke="#0b938b" stroke-width="3"/>
  <rect x="350" y="160" width="220" height="70" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="460" y="200" text-anchor="middle" fill="#16283a" font-size="13">白名單：只接受允許的值</text>
  <text x="460" y="220" text-anchor="middle" fill="#60717d" font-size="11">路徑必須限制在允許根目錄內</text>
</svg>
