<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="ac-title ac-desc">
  <title id="ac-title">認證與授權</title>
  <desc id="ac-desc">使用者先通過認證，每個資源請求再由伺服器檢查授權。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="70" y="70" width="220" height="100" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="180" y="112" text-anchor="middle" fill="#16283a" font-size="15" font-weight="700">使用者</text>
  <text x="180" y="138" text-anchor="middle" fill="#60717d" font-size="12">有帳號與密碼</text>
  <rect x="390" y="70" width="220" height="100" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="500" y="104" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">第一步：認證</text>
  <text x="500" y="132" text-anchor="middle" fill="#60717d" font-size="12">確認「你是誰」</text>
  <rect x="390" y="220" width="220" height="100" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="500" y="254" text-anchor="middle" fill="#9a5e27" font-size="14" font-weight="700">第二步：授權</text>
  <text x="500" y="282" text-anchor="middle" fill="#60717d" font-size="12">檢查「你能做什麼」</text>
  <rect x="710" y="220" width="160" height="100" rx="16" fill="#10243b"/>
  <text x="790" y="262" text-anchor="middle" fill="#93e5db" font-size="14" font-weight="700">資源</text>
  <text x="790" y="288" text-anchor="middle" fill="#ffffff" font-size="12">資料／功能</text>
  <path d="M290 120h100" stroke="#0b938b" stroke-width="3"/>
  <path d="M500 170v50" stroke="#d4872f" stroke-width="3"/>
  <path d="M610 270h100" stroke="#10243b" stroke-width="3"/>
  <text x="460" y="370" text-anchor="middle" fill="#60717d" font-size="14">伺服器必須在每個請求自行檢查授權</text>
</svg>
