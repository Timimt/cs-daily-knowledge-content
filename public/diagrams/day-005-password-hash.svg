<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="hash-title hash-desc">
  <title id="hash-title">密碼、鹽與慢速雜湊</title>
  <desc id="hash-desc">密碼與每個使用者獨立的隨機鹽一起進入慢速密碼雜湊，輸出固定長度的結果才存入資料庫。</desc>
  <rect width="920" height="430" fill="#eef7f4"/>
  <rect x="44" y="34" width="832" height="362" rx="24" fill="#ffffff" stroke="#cfe3df"/>
  <rect x="84" y="92" width="190" height="92" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="179" y="132" text-anchor="middle" fill="#16283a" font-size="17" font-weight="700">使用者密碼</text>
  <text x="179" y="158" text-anchor="middle" fill="#60717d" font-size="13">例如 Passw0rd!</text>
  <rect x="344" y="92" width="190" height="92" rx="16" fill="#fff1e7" stroke="#d4872f"/>
  <text x="439" y="132" text-anchor="middle" fill="#9a5e27" font-size="17" font-weight="700">隨機鹽 salt</text>
  <text x="439" y="158" text-anchor="middle" fill="#60717d" font-size="13">每個人都不一樣</text>
  <path d="M274 138h70" stroke="#0b938b" stroke-width="3"/>
  <path d="M534 138h62" stroke="#d4872f" stroke-width="3"/>
  <rect x="596" y="74" width="232" height="128" rx="18" fill="#10243b"/>
  <text x="712" y="118" text-anchor="middle" fill="#93e5db" font-size="16" font-weight="700">慢速密碼雜湊</text>
  <text x="712" y="146" text-anchor="middle" fill="#ffffff" font-size="13">scrypt / bcrypt / Argon2</text>
  <text x="712" y="172" text-anchor="middle" fill="#aebfd0" font-size="12">刻意耗時、耗記憶體</text>
  <path d="M828 202v78" stroke="#10243b" stroke-width="3"/>
  <rect x="84" y="280" width="744" height="70" rx="14" fill="#f1f5f6" stroke="#b7c5cc"/>
  <text x="456" y="309" text-anchor="middle" fill="#60717d" font-size="14">資料庫只保存：雜湊結果 + 鹽</text>
  <text x="456" y="333" text-anchor="middle" fill="#9a5e27" font-size="13">永遠不保存明文密碼</text>
</svg>
