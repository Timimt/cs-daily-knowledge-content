<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="lp-title lp-desc">
  <title id="lp-title">最小權限</title>
  <desc id="lp-desc">完整權限讓漏洞影響整個系統；最小權限把影響限制在必要範圍。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="70" y="60" width="310" height="160" rx="18" fill="#fff1e7" stroke="#d4872f"/>
  <text x="225" y="94" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">完整管理員權限</text>
  <text x="225" y="122" text-anchor="middle" fill="#60717d" font-size="12">程式被入侵</text>
  <rect x="110" y="140" width="230" height="60" rx="12" fill="#ffded1" stroke="#d4872f"/>
  <text x="225" y="176" text-anchor="middle" fill="#8b3d2f" font-size="13" font-weight="700">影響整個系統</text>
  <rect x="540" y="60" width="310" height="160" rx="18" fill="#d9f0ec" stroke="#0b938b"/>
  <text x="695" y="94" text-anchor="middle" fill="#0a7d74" font-size="15" font-weight="700">最小權限</text>
  <text x="695" y="122" text-anchor="middle" fill="#60717d" font-size="12">程式被入侵</text>
  <rect x="580" y="140" width="230" height="60" rx="12" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="695" y="176" text-anchor="middle" fill="#0a7d74" font-size="13" font-weight="700">只碰到必要範圍</text>
  <text x="460" y="280" text-anchor="middle" fill="#16283a" font-size="15">需要時再提升權限；服務帳號也一樣</text>
</svg>
