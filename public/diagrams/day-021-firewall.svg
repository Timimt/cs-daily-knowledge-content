<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="fw-title fw-desc">
  <title id="fw-title">防火牆與網路分段</title>
  <desc id="fw-desc">防火牆只放行必要連接埠；資料庫位於內部網段，限制橫向擴散。</desc>
  <rect width="920" height="430" fill="#f3f5ee"/>
  <rect x="50" y="50" width="180" height="80" rx="16" fill="#10243b"/>
  <text x="140" y="92" text-anchor="middle" fill="#93e5db" font-size="14" font-weight="700">網際網路</text>
  <rect x="310" y="38" width="240" height="104" rx="18" fill="#fff1e7" stroke="#d4872f"/>
  <text x="430" y="78" text-anchor="middle" fill="#9a5e27" font-size="15" font-weight="700">防火牆</text>
  <text x="430" y="106" text-anchor="middle" fill="#60717d" font-size="12">預設拒絕</text>
  <text x="430" y="126" text-anchor="middle" fill="#60717d" font-size="12">只放行 443 網頁</text>
  <path d="M230 90h80" stroke="#0b938b" stroke-width="3"/>
  <path d="M550 90h70" stroke="#0b938b" stroke-width="3"/>
  <rect x="620" y="50" width="220" height="80" rx="16" fill="#e3f5f1" stroke="#0b938b"/>
  <text x="730" y="84" text-anchor="middle" fill="#0a7d74" font-size="14" font-weight="700">Web 伺服器</text>
  <text x="730" y="108" text-anchor="middle" fill="#60717d" font-size="12">對外公開</text>
  <rect x="620" y="240" width="220" height="80" rx="16" fill="#ffffff" stroke="#b7c5cc"/>
  <text x="730" y="274" text-anchor="middle" fill="#16283a" font-size="14" font-weight="700">資料庫</text>
  <text x="730" y="298" text-anchor="middle" fill="#60717d" font-size="12">內部網段，不對外</text>
  <path d="M730 130v110" stroke="#0b938b" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="460" y="250" text-anchor="middle" fill="#60717d" font-size="14">攻擊者拿下 Web，也不一定能直接碰到資料庫</text>
</svg>
